name: Version française Windows
on:
  push:
    branches: [francais-cubes]
    tags: ["v*-fr"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: french-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Tests .NET hors Npcap
        run: dotnet test CubeRadar.slnx -c Release --filter "Needs!=Npcap" --logger "trx;LogFileName=tests.trx"
      - name: Tests Python et traductions
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Aperçus sans jeu ni capture réseau
        run: dotnet run --project src/CubeRadar.Cli -c Release -- --preview previews
      - name: Compiler et empaqueter
        shell: pwsh
        run: ./tools/package.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: radar-cubes-fr-windows
          path: |
            dist/*.zip
            dist/*.exe
            dist/SHA256SUMS.txt
            previews/*.png
            tests/**/TestResults/*.trx
          if-no-files-found: error
